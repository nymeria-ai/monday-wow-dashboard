<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week-over-Week Performance Dashboard</title>
<style>
:root {
    --bg: #0f0f0f;
    --surface-0: #1a1a1a;
    --surface-1: #222;
    --surface-2: #272727;
    --border: #333;
    --text: #e8e8e8;
    --text-secondary: #999;
    --green: #1D9E75;
    --red: #D85A30;
    --amber: #eda100;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    padding: 24px;
    max-width: 1400px;
    margin: 0 auto;
}
h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 4px;
}
.subtitle {
    color: var(--text-secondary);
    font-size: 12px;
    margin-bottom: 20px;
}
.filter-bar {
    margin-bottom: 24px;
}
.filter-bar label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text-secondary);
    margin-right: 8px;
}
.filter-bar select {
    background: var(--surface-1);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    min-width: 200px;
    outline: none;
}
.filter-bar select:focus {
    border-color: var(--green);
}
.kpi-block {
    background: var(--surface-0);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 24px;
}
.kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}
.kpi-card {
    background: var(--surface-2);
    border-radius: 8px;
    padding: 12px;
}
.kpi-label {
    font-size: 10px;
    text-transform: uppercase;
    color: var(--text-secondary);
    letter-spacing: 0.3px;
    margin-bottom: 4px;
}
.kpi-val {
    font-size: 22px;
    font-weight: 600;
}
.kpi-delta {
    font-size: 11px;
    margin-top: 2px;
}
.up { color: #4ade80; font-weight: 500; }
.dn { color: #f87171; font-weight: 500; }
.neu { color: #888; }
.table-wrap {
    border: 0.5px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
}
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}
th {
    text-align: left;
    font-size: 10px;
    text-transform: uppercase;
    color: var(--text-secondary);
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
    font-weight: 500;
    letter-spacing: 0.3px;
    white-space: nowrap;
    position: sticky;
    top: 0;
    background: var(--surface-0);
}
td {
    padding: 8px 8px;
    border-bottom: 1px solid #1a1a1a;
    white-space: nowrap;
}
.tr-alt { background: var(--surface-1); }
.right { text-align: right; }
.week-cell { font-weight: 500; color: var(--text); }

@media (max-width: 900px) {
    body { padding: 12px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .table-wrap { overflow-x: auto; }
    h1 { font-size: 17px; }
}
@media (max-width: 480px) {
    .kpi-grid { grid-template-columns: 1fr; }
    .filter-bar select { width: 100%; }
}
.chart-section {
    background: var(--surface-0);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 24px;
}
.chart-toggles {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
}
.chart-toggle {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 11px;
    font-family: inherit;
    padding: 5px 12px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
}
.chart-toggle:hover {
    border-color: #555;
    color: var(--text);
}
.chart-toggle.active {
    border-color: var(--green);
    color: var(--green);
    background: rgba(29, 158, 117, 0.12);
}
.chart-toggle .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
}
#chart-canvas {
    width: 100% !important;
    max-height: 320px;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function weekLabel(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const end = new Date(d);
    end.setDate(end.getDate() + 6);
    const m = MONTHS[d.getMonth()];
    return m + ' ' + d.getDate() + '–' + end.getDate();
}

function fmt(n, prefix) {
    if (n == null || isNaN(n)) return '—';
    const s = Math.abs(n) >= 1000
        ? Math.round(n).toLocaleString('en-US')
        : n % 1 === 0 ? n.toLocaleString('en-US') : n.toFixed(1);
    return (prefix || '') + s;
}

function fmtMoney(n) {
    if (n == null || isNaN(n)) return '—';
    return '$' + Math.round(n).toLocaleString('en-US');
}

function fmtRoas(n) {
    if (n == null || isNaN(n) || !isFinite(n)) return '—';
    return (n * 100).toFixed(0) + '%';
}

function delta(cur, prev) {
    if (!prev || prev === 0) return { pct: null, html: '<span class="neu">—</span>' };
    const pct = ((cur - prev) / Math.abs(prev)) * 100;
    return { pct };
}

function deltaHtml(pct, invert) {
    if (pct == null) return '<span class="neu">—</span>';
    const abs = Math.abs(pct).toFixed(1);
    const isUp = pct > 0;
    let cls;
    if (invert) {
        cls = isUp ? 'dn' : 'up';
    } else {
        cls = isUp ? 'up' : 'dn';
    }
    if (Math.abs(pct) < 0.05) return '<span class="neu">0.0%</span>';
    const arrow = isUp ? '▲' : '▼';
    return `<span class="${cls}">${arrow} ${abs}%</span>`;
}

function getRows(cluster) {
    return DATA[cluster] || [];
}

function render(cluster) {
    const rows = getRows(cluster);
    if (!rows.length) return;

    // KPI — last week vs prior
    const last = rows[rows.length - 1];
    const prev = rows.length > 1 ? rows[rows.length - 2] : null;

    const lastRoas = last.spend > 0 ? last.vbb_value / last.spend : 0;
    const prevRoas = prev && prev.spend > 0 ? prev.vbb_value / prev.spend : 0;

    const kpis = [
        { label: 'Spend', val: fmtMoney(last.spend), d: delta(last.spend, prev?.spend) },
        { label: 'Impressions', val: fmt(last.imp), d: delta(last.imp, prev?.imp) },
        { label: 'Hard Signups', val: fmt(last.signups), d: delta(last.signups, prev?.signups) },
        { label: 'VBB ROAS', val: fmtRoas(lastRoas), d: delta(lastRoas, prevRoas) },
    ];

    document.getElementById('kpi-grid').innerHTML = kpis.map(k => {
        const dHtml = k.d.pct != null ? deltaHtml(k.d.pct, false) : '<span class="neu">—</span>';
        return `<div class="kpi-card">
            <div class="kpi-label">${k.label}</div>
            <div class="kpi-val">${k.val}</div>
            <div class="kpi-delta">${dHtml} vs prior week</div>
        </div>`;
    }).join('');

    // Table
    let html = '';
    rows.forEach((r, i) => {
        const prev = i > 0 ? rows[i - 1] : null;
        const roas = r.spend > 0 ? r.vbb_value / r.spend : 0;
        const prevRoas = prev && prev.spend > 0 ? prev.vbb_value / prev.spend : 0;
        const cps = r.signups > 0 ? r.spend / r.signups : 0;
        const prevCps = prev && prev.signups > 0 ? prev.spend / prev.signups : 0;

        const spendD = delta(r.spend, prev?.spend);
        const impD = delta(r.imp, prev?.imp);
        const suD = delta(r.signups, prev?.signups);
        const roasD = delta(roas, prevRoas);
        const cpsD = delta(cps, prevCps);

        const altClass = i % 2 === 1 ? ' class="tr-alt"' : '';
        html += `<tr${altClass}>
            <td class="week-cell">${weekLabel(r.week)}</td>
            <td class="right">${fmtMoney(r.spend)}</td>
            <td class="right">${deltaHtml(spendD.pct, false)}</td>
            <td class="right">${fmt(r.imp)}</td>
            <td class="right">${deltaHtml(impD.pct, false)}</td>
            <td class="right">${fmt(r.signups)}</td>
            <td class="right">${deltaHtml(suD.pct, false)}</td>
            <td class="right">${r.signups > 0 ? fmtMoney(cps) : '—'} ${i > 0 && r.signups > 0 && prevCps > 0 ? deltaHtml(cpsD.pct, true) : ''}</td>
            <td class="right">${fmt(r.payers)}</td>
            <td class="right">${r.spend > 0 ? fmtRoas(roas) : '—'}</td>
            <td class="right">${deltaHtml(roasD.pct, false)}</td>
        </tr>`;
    });
    document.getElementById('table-body').innerHTML = html;
}

// Compute "All exc. Brand" by summing all individual clusters except Brand and All
function computeAllExcBrand() {
    const exclude = new Set(['All', 'Brand', 'Other']);
    const clusterKeys = Object.keys(DATA).filter(k => !exclude.has(k));
    // Collect all week dates
    const weekSet = new Set();
    clusterKeys.forEach(k => DATA[k].forEach(r => weekSet.add(r.week)));
    const weeks = [...weekSet].sort();
    return weeks.map(w => {
        const row = { week: w, spend: 0, imp: 0, clicks: 0, signups: 0, payers: 0, vbb_value: 0 };
        clusterKeys.forEach(k => {
            const match = DATA[k].find(r => r.week === w);
            if (match) {
                row.spend += match.spend;
                row.imp += match.imp;
                row.clicks += match.clicks;
                row.signups += match.signups;
                row.payers += match.payers;
                row.vbb_value += match.vbb_value;
            }
        });
        return row;
    });
}
DATA['All exc. Brand'] = computeAllExcBrand();

const select = document.getElementById('cluster-select');
const keys = Object.keys(DATA).sort((a, b) => {
    if (a === 'All') return -1;
    if (b === 'All') return 1;
    if (a === 'All exc. Brand') return -1;
    if (b === 'All exc. Brand') return 1;
    return a.localeCompare(b);
});
keys.forEach(k => {
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = k;
    if (k === 'All') opt.selected = true;
    select.appendChild(opt);
});
// ── Chart setup ──
const METRICS = [
    { id: 'spend',   label: 'Spend',          type: 'bar',  color: '#6366f1', fmt: v => '$' + (v/1000).toFixed(0) + 'K', valueFn: r => r.spend },

    { id: 'cpc',     label: 'Avg CPC',         type: 'line', color: '#f59e0b', fmt: v => '$' + v.toFixed(2),              valueFn: r => r.clicks > 0 ? r.spend / r.clicks : 0 },
    { id: 'signups', label: 'Hard Signups',     type: 'bar',  color: '#4ade80', fmt: v => v.toFixed(0),                    valueFn: r => r.signups },
    { id: 'cr',      label: 'CR to SU',        type: 'line', color: '#a78bfa', fmt: v => (v*100).toFixed(1) + '%',        valueFn: r => r.clicks > 0 ? r.signups / r.clicks : 0 },
    { id: 'cps',     label: 'CPS Hard Signup', type: 'line', color: '#f87171', fmt: v => '$' + v.toFixed(0),              valueFn: r => r.signups > 0 ? r.spend / r.signups : 0 },
    { id: 'payers',  label: 'Payers',          type: 'line', color: '#2dd4bf', fmt: v => v.toFixed(0),                    valueFn: r => r.payers },
    { id: 'roas',    label: 'VBB ROAS',        type: 'line', color: '#fb923c', fmt: v => (v * 100).toFixed(0) + '%',       valueFn: r => r.spend > 0 ? r.vbb_value / r.spend : 0 },
];

const activeMetrics = new Set(['spend', 'cps']); // defaults
let chartInstance = null;

// Build toggle buttons
const toggleContainer = document.getElementById('chart-toggles');
METRICS.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'chart-toggle' + (activeMetrics.has(m.id) ? ' active' : '');
    btn.dataset.id = m.id;
    btn.innerHTML = `<span class="dot" style="background:${m.color}"></span>${m.label}`;
    btn.addEventListener('click', () => {
        if (activeMetrics.has(m.id)) {
            activeMetrics.delete(m.id);
            btn.classList.remove('active');
        } else {
            activeMetrics.add(m.id);
            btn.classList.add('active');
        }
        renderChart(select.value);
    });
    toggleContainer.appendChild(btn);
});

function renderChart(cluster) {
    const rows = getRows(cluster);
    if (!rows.length) return;
    const labels = rows.map(r => weekLabel(r.week));
    const active = METRICS.filter(m => activeMetrics.has(m.id));

    // Separate bar and line metrics for dual axes
    const barMetrics = active.filter(m => m.type === 'bar');
    const lineMetrics = active.filter(m => m.type === 'line');

    const datasets = [];
    const scales = {
        x: {
            grid: { color: 'rgba(255,255,255,0.04)' },
            ticks: { color: '#999', font: { size: 11 } },
        }
    };

    // Each active metric gets its own y-axis to handle different scales
    active.forEach((m, idx) => {
        const axisId = 'y_' + m.id;
        const data = rows.map(r => m.valueFn(r));
        const isBar = m.type === 'bar';
        const position = isBar ? 'left' : 'right';

        datasets.push({
            label: m.label,
            data: data,
            type: m.type,
            yAxisID: axisId,
            backgroundColor: isBar ? m.color + '99' : 'transparent',
            borderColor: m.color,
            borderWidth: isBar ? 0 : 2.5,
            pointRadius: 3,
            pointBackgroundColor: m.color,
            tension: 0.3,
            order: isBar ? 2 : 1, // lines render on top
            barPercentage: barMetrics.length > 1 ? 0.5 : 0.6,
            categoryPercentage: barMetrics.length > 1 ? 0.8 : 0.7,
        });

        scales[axisId] = {
            type: 'linear',
            position: position,
            display: active.length <= 3, // hide axes when too many
            grid: { display: idx === 0, color: 'rgba(255,255,255,0.04)' },
            ticks: {
                color: m.color,
                font: { size: 10 },
                callback: function(v) { return m.fmt(v); },
                maxTicksLimit: 5,
            },
            beginAtZero: true,
        };
    });

    if (chartInstance) chartInstance.destroy();

    const ctx = document.getElementById('chart-canvas').getContext('2d');
    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
                mode: 'index',
                intersect: false,
            },
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: '#1a1a1a',
                    borderColor: '#333',
                    borderWidth: 1,
                    titleColor: '#e8e8e8',
                    bodyColor: '#ccc',
                    padding: 10,
                    callbacks: {
                        label: function(ctx) {
                            const m = METRICS.find(x => x.label === ctx.dataset.label);
                            return ctx.dataset.label + ': ' + (m ? m.fmt(ctx.raw) : ctx.raw);
                        }
                    }
                }
            },
            scales: scales,
        }
    });

    // Set canvas height
    document.getElementById('chart-canvas').parentElement.style.height = '320px';
    document.getElementById('chart-canvas').style.height = '320px';
}

select.addEventListener('change', () => {
    render(select.value);
    renderChart(select.value);
});
render('All');
renderChart('All');
