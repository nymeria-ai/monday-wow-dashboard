<style>
:root {
    --bg: #0f0f0f; --surface-0: #1a1a1a; --surface-1: #222; --surface-2: #272727;
    --border: #333; --text: #e8e8e8; --text-secondary: #999;
    --green: #4ade80; --red: #f87171; --amber: #fbbf24; --blue: #60a5fa; --purple: #a78bfa;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 13px; line-height: 1.5; padding: 24px; max-width: 1200px; margin: 0 auto;
}
h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
h2 { font-size: 15px; font-weight: 600; margin: 24px 0 12px; color: var(--text-secondary); }
.subtitle { color: var(--text-secondary); font-size: 12px; margin-bottom: 20px; }

/* Tab bars */
.tab-bar { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 2px solid var(--border); }
.tab-btn {
    background: transparent; color: var(--text-secondary); border: none; border-bottom: 2px solid transparent;
    padding: 10px 20px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
    margin-bottom: -2px; transition: all 0.15s;
}
.tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
.tab-btn:hover { color: var(--text); }

.toggle-bar { display: flex; gap: 8px; margin-bottom: 20px; }
.toggle-btn {
    background: var(--surface-1); color: var(--text-secondary); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 16px; font-size: 12px; cursor: pointer; font-family: inherit;
}
.toggle-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.toggle-btn:hover { border-color: var(--blue); }

.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.stat-card { background: var(--surface-0); border-radius: 10px; padding: 14px; }
.stat-label { font-size: 10px; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.4px; }
.stat-val { font-size: 24px; font-weight: 700; margin-top: 4px; }
.stat-sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.chart-block { background: var(--surface-0); border-radius: 12px; padding: 16px; margin-bottom: 24px; }
.verdict {
    background: var(--surface-0); border-radius: 12px; padding: 20px;
    border-left: 4px solid var(--amber); margin-bottom: 24px;
}
.verdict h3 { font-size: 14px; margin-bottom: 8px; }
.verdict p { color: var(--text-secondary); font-size: 13px; line-height: 1.7; }
.verdict strong { color: var(--text); }
.table-wrap { background: var(--surface-0); border-radius: 12px; overflow: auto; max-height: 500px; }
table { width: 100%; border-collapse: collapse; }
th { background: var(--surface-1); text-align: left; padding: 10px 12px; font-size: 11px;
     text-transform: uppercase; color: var(--text-secondary); position: sticky; top: 0; z-index: 1; }
td { padding: 8px 12px; border-top: 1px solid var(--border); font-size: 12px; }
.right { text-align: right; }
.weak { color: var(--amber); }
.moderate { color: #fb923c; }
.strong { color: var(--green); }
</style>
</head>

// ─── HELPERS ───
function pearson(xs, ys) {
    const n = xs.length;
    if (n < 3) return { r: 0, r2: 0 };
    const mx = xs.reduce((s,v)=>s+v,0)/n, my = ys.reduce((s,v)=>s+v,0)/n;
    let cov = 0, sx = 0, sy = 0;
    for (let i = 0; i < n; i++) { cov += (xs[i]-mx)*(ys[i]-my); sx += (xs[i]-mx)**2; sy += (ys[i]-my)**2; }
    sx = Math.sqrt(sx); sy = Math.sqrt(sy);
    const r = (sx > 0 && sy > 0) ? cov/(sx*sy) : 0;
    return { r, r2: r*r };
}

function rollingCorr(data, window) {
    const result = [];
    for (let i = window-1; i < data.length; i++) {
        const sl = data.slice(i-window+1, i+1);
        const { r } = pearson(sl.map(d=>d.val), sl.map(d=>d.vbb));
        result.push({ date: data[i].date, r: Math.round(r*10000)/10000 });
    }
    return result;
}

function aggregateWeekly(daily) {
    const weeks = {};
    daily.forEach(d => {
        const dt = new Date(d.date + 'T00:00:00');
        const day = dt.getDay(); const diff = dt.getDate() - day + (day === 0 ? -6 : 1);
        const mon = new Date(dt); mon.setDate(diff);
        const key = mon.toISOString().split('T')[0];
        if (!weeks[key]) weeks[key] = { date: key, val: 0, vbb: 0 };
        weeks[key].val += d.val; weeks[key].vbb += d.vbb;
    });
    return Object.values(weeks).sort((a, b) => a.date.localeCompare(b.date));
}

const fmtDate = d => { const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}); };

function strengthLabel(r) {
    const a = Math.abs(r);
    if (a < 0.3) return { text: 'Very weak', cls: 'weak' };
    if (a < 0.5) return { text: 'Weak', cls: 'weak' };
    if (a < 0.7) return { text: 'Moderate', cls: 'moderate' };
    return { text: 'Strong', cls: 'strong' };
}

            <div class="stat-sub">VBB explains ${(r2*100).toFixed(1)}% of ${cfg.metricLabel} variance</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Avg ${viewLabel} ${cfg.metricLabel}</div>
            <div class="stat-val">${avgM.toFixed(1)}</div>
            <div class="stat-sub">Range: ${Math.min(...mArr).toFixed(0)}–${Math.max(...mArr).toFixed(0)}</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Avg ${viewLabel} VBB</div>
            <div class="stat-val">${cfg.vbbFmt(avgV)}</div>
            <div class="stat-sub">${cfg.campaigns} · ${data.length} ${currentView === 'daily' ? 'days' : 'weeks'}</div>
        </div>
    `;

    const labels = data.map(d => fmtDate(d.date));

    // Trend
    document.getElementById('trend-title').textContent = `Trend — VBB Value & ${cfg.metricLabel}`;
    trendChart = new Chart(document.getElementById('trend-chart').getContext('2d'), {
        type: 'line',
        data: { labels, datasets: [
            { label: cfg.metricLabel, data: mArr, borderColor: cfg.metricColor, backgroundColor: cfg.metricColor+'15', fill: true, tension: 0.3, pointRadius: currentView==='daily'?2:4, pointBackgroundColor: cfg.metricColor, borderWidth: 2, yAxisID: 'y1' },
            { label: 'VBB Value', data: vArr, borderColor: '#f59e0b', backgroundColor: 'transparent', tension: 0.3, pointRadius: currentView==='daily'?2:4, pointBackgroundColor: '#f59e0b', borderWidth: 2, yAxisID: 'y2' }
        ]},
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { labels: { color: '#999', font: { size: 11 } } },
                tooltip: { backgroundColor: '#1a1a1a', borderColor: '#333', borderWidth: 1, titleColor: '#e8e8e8', bodyColor: '#ccc',
                    callbacks: { title: ctx => data[ctx[0].dataIndex].date,
                        label: ctx => ctx.dataset.label === 'VBB Value' ? `VBB: ${cfg.vbbFmt(ctx.raw)}` : `${cfg.metricLabel}: ${cfg.valFmt(ctx.raw)}` } }
            },
            scales: {
                x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#999', maxRotation: 45, maxTicksLimit: 15 } },
                y1: { position: 'left', title: { display: true, text: cfg.metricLabel, color: cfg.metricColor }, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: cfg.metricColor, font: { size: 10 } }, beginAtZero: true },
                y2: { position: 'right', title: { display: true, text: 'VBB Value', color: '#f59e0b' }, grid: { display: false }, ticks: { color: '#f59e0b', font: { size: 10 }, callback: v => cfg.vbbFmt(v) }, beginAtZero: true }
            }
        }
    });

    // Scatter
    document.getElementById('scatter-title').textContent = `Scatter Plot — VBB vs ${cfg.metricLabel} (with regression)`;
    const meanM = avgM, meanV = avgV;
    const slope = mArr.reduce((s,p,i) => s + (p-meanM)*(vArr[i]-meanV), 0) / mArr.reduce((s,p) => s + (p-meanM)**2, 0);
    const intercept = meanV - slope * meanM;
    const minM = Math.min(...mArr), maxM = Math.max(...mArr);

    scatterChart = new Chart(document.getElementById('scatter-chart').getContext('2d'), {
        type: 'scatter',
        data: { datasets: [
            { label: `${viewLabel} Data Points`, data: data.map(d => ({x: d.val, y: d.vbb})), backgroundColor: cfg.metricColor, pointRadius: currentView==='daily'?5:7, pointHoverRadius: 8 },
            { label: `Regression (r=${r.toFixed(3)})`, data: [{x:Math.max(0,minM-1),y:slope*Math.max(0,minM-1)+intercept},{x:maxM+1,y:slope*(maxM+1)+intercept}], type:'line', borderColor:'#f8717188', borderWidth:2, borderDash:[6,4], pointRadius:0, fill:false }
        ]},
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
                legend: { labels: { color: '#999', font: { size: 11 } } },
                tooltip: { backgroundColor: '#1a1a1a', borderColor: '#333', borderWidth: 1, titleColor: '#e8e8e8', bodyColor: '#ccc',
                    callbacks: { label: ctx => ctx.datasetIndex === 0 ? `${cfg.metricLabel}: ${cfg.valFmt(ctx.raw.x)}, VBB: ${cfg.vbbFmt(ctx.raw.y)}` : '' } }
            },
            scales: {
                x: { title: { display: true, text: `${cfg.metricLabel} (${currentView} count)`, color: '#999' }, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#999' } },
                y: { title: { display: true, text: 'VBB Value ($)', color: '#999' }, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#999', callback: v => cfg.vbbFmt(v) } }
            }
        }
    });

    // Rolling
    const rollLabel = `Rolling ${rollWindow}-${currentView==='daily'?'Day':'Week'} Correlation Over Time`;
    document.getElementById('rolling-title').textContent = rollLabel;
    rollingChart = new Chart(document.getElementById('rolling-chart').getContext('2d'), {
        type: 'line',
        data: { labels: roll.map(d => fmtDate(d.date)), datasets: [
            { label: `Rolling r`, data: roll.map(d=>d.r), borderColor: '#a78bfa', backgroundColor: roll.map(d => d.r>=0?'rgba(74,222,128,0.15)':'rgba(248,113,113,0.15)'), fill: true, tension: 0.3, pointRadius: currentView==='daily'?1.5:5, pointBackgroundColor: roll.map(d=>d.r>=0?'#4ade80':'#f87171'), borderWidth: 2 },
            { label: 'Zero', data: roll.map(()=>0), borderColor:'rgba(255,255,255,0.15)', borderWidth:1, borderDash:[4,4], pointRadius:0, fill:false }
        ]},
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1a1a1a', borderColor: '#333', borderWidth: 1, titleColor: '#e8e8e8', bodyColor: '#ccc',
                callbacks: { title: ctx => roll[ctx[0].dataIndex]?.date||'', label: ctx => ctx.datasetIndex===0 ? `r = ${ctx.raw.toFixed(4)}` : '' } } },
            scales: {
                x: { grid:{color:'rgba(255,255,255,0.04)'}, ticks:{color:'#999',maxRotation:45,maxTicksLimit:15} },
                y: { min:-1,max:1, grid:{color:'rgba(255,255,255,0.04)'}, ticks:{color:'#999',stepSize:0.5}, title:{display:true,text:'Pearson r',color:'#999'} }
            }
        }
    });

    // Verdict
    document.getElementById('verdict').innerHTML = `
        <h3>📊 Verdict — ${cfg.metricLabel} ${viewLabel} View (r = ${r.toFixed(3)})</h3>
        <p><strong>${sl.text} ${dir} correlation</strong> at the ${currentView} level.
        R² = ${(r2*100).toFixed(1)}% — VBB explains ${(r2*100).toFixed(1)}% of ${cfg.metricLabel} variance.
        ${Math.abs(r)<0.3 ? ' This is statistically negligible.' : ''}
        ${Math.abs(r)>=0.7 ? ` <strong>VBB is a reliable directional signal for ${cfg.metricLabel}.</strong>` : ''}
        ${Math.abs(r)>=0.5 && Math.abs(r)<0.7 ? ` VBB has moderate predictive value for ${cfg.metricLabel}.` : ''}
        </p>
        <p style="margin-top:8px">Scope: ${cfg.scope}. ${data.length} ${currentView==='daily'?'days':'weeks'} of data.</p>
    `;

    // Table
    document.getElementById('table-head').innerHTML = `<tr><th>Date</th><th class="right">${cfg.metricLabel}</th><th class="right">VBB Value</th><th class="right">VBB / ${cfg.metricLabel.split(' ')[0]}</th></tr>`;
    const tbody = document.getElementById('table-body');
    tbody.innerHTML = '';
    data.forEach(d => {
        const ratio = d.val > 0 ? d.vbb / d.val : 0;
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${d.date}</td><td class="right">${cfg.valFmt(d.val)}</td><td class="right">${cfg.vbbFmt(d.vbb)}</td><td class="right">${d.val > 0 ? cfg.vbbFmt(ratio) : '—'}</td>`;
        tbody.appendChild(tr);
    });
}

// Tab clicks
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        renderAll();
    });
});

// View toggle clicks
document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentView = btn.dataset.view;
        renderAll();
    });
});

renderAll();
</script>
</body>
</html>
